name: Snake Game

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: JeanHeberth
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake.svg

      - name: Validate generated snake
        run: |
          test -s dist/github-contribution-grid-snake.gif
          test -s dist/github-contribution-grid-snake.svg
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET

          root = ET.parse("dist/github-contribution-grid-snake.svg").getroot()
          cells = [node for node in root.iter() if "c" in node.get("class", "").split()]
          if not cells:
              raise SystemExit("Snake SVG has no contribution cells")
          print(f"Validated {len(cells)} contribution cells")
          PYTHON

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
